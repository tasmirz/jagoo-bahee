[workspace]
resolver = "2"
members = ["crates/jb-core"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
sha2 = "0.10"
ed25519-dalek = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
