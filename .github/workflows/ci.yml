# P0 exit gates, as blocking CI.
#
# CLAUDE.md §7.4: never disable one of these to get a build green. Each exists because it
# caught a real, expensive v1 bug. The cross-language vector job is the single
# highest-value gate in the project — it is what permanently forecloses the v1
# signature-confusion bug class.
#
# | Gate  | Job                                    |
# |-------|----------------------------------------|
# | P0-G1 | vectors  (TS = Rust = Python)          |
# | P0-G2 | vectors  (domain separation)           |
# | P0-G3 | vectors  (plane separation)            |
# | P0-G4 | vectors  (field omission — the v1 bug) |
# | P0-G5 | contracts (registry codegen identical) |
# | P0-G6 | backend  (import-boundary lint probes) |
# | P0-G7 | backend  (unknown version / domain)    |
#
# P2 exit gates (Plans/05 §8) are blocking from here on:
#
# | Gate         | Job                                                          |
# |--------------|--------------------------------------------------------------|
# | FG-01..FG-10 | federation (two independent stacks over real loopback gRPC)   |
# | FG-05        | build      (real Mongo: unique index + concurrent insertion)  |

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '9.15.4'
  NODE_VERSION: '20'

jobs:
  # ── P0-G5 — generated code is in sync with proto/ ────────────────────────────────────
  # AR-10 / build log L-01: never hand-edit generated code. This regenerates and diffs, so
  # a hand edit fails here rather than silently surviving until someone else regenerates.
  contracts:
    name: contracts (P0-G5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: buf lint
        run: pnpm proto:lint
      - name: regenerate and diff (AR-10)
        run: pnpm proto:check
      - name: no uncommitted codegen drift
        run: git diff --exit-code

  # ── ★ P0-G1..G4 — the cross-language canonical gate ─────────────────────────────────
  vectors:
    name: ★ cross-language vectors (P0-G1..G4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pip install pytest

      # The gate proper: three independent implementations, compared pairwise.
      - name: TS = Rust = Python (P0-G1)
        run: pnpm vectors

      # Each language also asserts the three regressions in its own idiom, so a language
      # cannot pass the pairwise diff while getting domain/plane separation wrong locally.
      - name: TypeScript regressions (P0-G2..G4)
        run: pnpm --filter @jagoo/sdk test
      - name: Rust regressions (P0-G2..G4)
        run: cargo test -p jb-core
      - name: Python regressions (P0-G2..G4)
        run: python -m pytest tools/vectors -q

  # ── P0-G6/G7, durable P1 adapter gates, and the rest of the workspace ────────────────
  build:
    name: lint · typecheck · test (P0 + P1 adapters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: start transaction-capable Mongo and Redis
        run: |
          docker compose -f ops/docker-compose.yml up -d --wait mongo redis
          docker compose -f ops/docker-compose.yml run --rm mongo-init

      # Import boundaries are enforced here AND probed by backend/src/core/
      # import-boundary.spec.ts, which lints a deliberately violating file. A rule that is
      # merely configured is a rule that can silently stop working.
      - name: lint (AR-01, AR-02, AR-05, SG-01)
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: build
        run: pnpm build
      - name: test (includes P0-G6 lint probes and P0-G7 rejection)
        run: pnpm test
      # ── Why directConnection=true and not replicaSet=rs0 ────────────────────────────
      # `mongo-init` initiates the set with member host `mongo:27017`, which is correct:
      # every in-network service resolves that name. A client on the RUNNER HOST does not.
      # With `?replicaSet=rs0` the driver treats the URL as a seed, discovers the sole
      # member as `mongo:27017`, cannot resolve it, and never completes server selection —
      # observed as `Hook timed out in 10000ms` with no mention of DNS or of Mongo.
      # `directConnection=true` skips topology discovery and talks to the mapped port. The
      # server is still a replica-set member, so multi-document transactions — the entire
      # point of VP-02 — still work. Build log L-16.
      #
      # JB_REQUIRE_INTEGRATION makes a missing URL fail instead of skipping. Without it,
      # a typo here reports green while running nothing (L-11).
      - name: production adapter integration gates (VP-02, P1-G6, T1.33)
        run: >-
          pnpm --filter @jagoo/backend exec vitest run
          src/adapters/outbound/mongo/mongo.integration.spec.ts
          src/adapters/outbound/mongo/federation.integration.spec.ts
          src/adapters/outbound/redis/redis.integration.spec.ts
        env:
          JB_REQUIRE_INTEGRATION: '1'
          MONGO_URL: mongodb://127.0.0.1:27017/jagoo_ci?directConnection=true
          REDIS_URL: redis://127.0.0.1:6379/15
      - name: infrastructure logs on failure
        if: failure()
        run: docker compose -f ops/docker-compose.yml logs mongo mongo-init redis
      - name: stop test infrastructure
        if: always()
        run: docker compose -f ops/docker-compose.yml down -v

  # ── ★ P2 — the federation exit gate ─────────────────────────────────────────────────
  # Two independent stacks, real `nice-grpc` servers on loopback, real Ed25519 signatures,
  # the real 19-step pipeline on both sides. FG-01 … FG-10 from Plans/05 §8.
  #
  # A SEPARATE job on purpose. This is the PRIMARY goal of the project, and burying it in
  # the general test job would let a green summary hide it being skipped — which is the
  # failure mode L-11 exists to prevent. It needs no containers, so it also stays fast.
  federation:
    name: ★ federation gate (FG-01..FG-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The sdk is consumed as BUILT output by every consumer (build log L-12), so the
      # e2e suite cannot run against src/.
      - name: build @jagoo/sdk
        run: pnpm --filter @jagoo/sdk build
      - name: FG-01 … FG-10 over loopback gRPC
        run: pnpm --filter @jagoo/backend exec vitest run src/federation
      - name: federation unit gates (trust, quota, backoff, announce, config)
        run: >-
          pnpm --filter @jagoo/backend exec vitest run
          src/core/domain/federation
          src/composition/federation.config.spec.ts
          src/adapters/inbound/http/federation-discovery.spec.ts
