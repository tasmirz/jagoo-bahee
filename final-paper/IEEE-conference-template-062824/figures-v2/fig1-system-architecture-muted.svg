  <line x1="68" y1="104" x2="68" y2="116" stroke="#506775" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <rect width="136" height="152" rx="4" fill="none" stroke="#65737B" stroke-width="1.25"/>
