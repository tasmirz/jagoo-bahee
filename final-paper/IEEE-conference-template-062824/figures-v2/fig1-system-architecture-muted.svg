    <rect x="8" y="119" width="120" height="28" rx="3"/>
  </g>
  <g text-anchor="middle" class="hdr" font-size="9">
    <text x="68" y="46">19-Stage Admission</text>
    <text x="68" y="93">Store + Merkle Log</text>
