<!-- Federation arrows connect peer boundaries rather than internal stages. -->
<line x1="141" y1="143" x2="203" y2="143" stroke="#506775" stroke-width="1.4" marker-end="url(#arr-blue)"/>
<text x="172" y="135" text-anchor="middle" class="hdr" font-size="8.6" style="fill:#506775">HTTP</text>
<line x1="205" y1="190" x2="143" y2="190" stroke="#6D6255" stroke-width="1.4" marker-end="url(#arr-amber)"/>
