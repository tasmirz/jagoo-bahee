<line x1="334" y1="184" x2="382" y2="184" stroke="#506775" stroke-width="1.4" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
<text x="358" y="176" text-anchor="middle" class="hdr" font-size="8.6" style="fill:#506775">gRPC</text>
<line x1="518" y1="184" x2="552" y2="184" stroke="#506775" stroke-width="1.4" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
<text x="535" y="176" text-anchor="middle" class="hdr" font-size="8.6" style="fill:#506775">gRPC</text>
<text x="450" y="266" text-anchor="middle" class="mut" font-size="8.6">Each node validates the envelope. Trust sets quotas and traffic classes.</text>

