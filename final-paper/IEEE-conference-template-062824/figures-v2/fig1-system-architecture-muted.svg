<!-- Muted palette variant of fig1-system-architecture.svg for iccit2026-paper-prev-v2. -->
<svg xmlns="http://www.w3.org/2000/svg" width="7.00in" height="3.36in" viewBox="0 0 700 336">

<defs>
  <style>
    .t { font-family: 'Liberation Sans', Arial, sans-serif; fill: #30383D; }
    .hdr { font-family: 'Liberation Sans', Arial, sans-serif; fill: #30383D; font-weight: 700; }
    .mut { font-family: 'Liberation Sans', Arial, sans-serif; fill: #525D63; }
  </style>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#30383D"/>
  </marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#506775"/>
  </marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#6D6255"/>
  </marker>
  <marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#525D63"/>
  </marker>
</defs>

<rect width="700" height="336" fill="#FFFFFF"/>
<text x="12" y="16" class="t" font-size="9.5" font-weight="700">REACHABILITY REGIMES</text>
<rect x="12" y="22" width="110" height="24" rx="3.0" fill="#FFFFFF" stroke="#506775" stroke-width="1.15"/>
<text x="67.0" y="37.2" text-anchor="middle" class="t" font-size="9.3" font-weight="700" style="fill:#506775">L0 · GLOBAL</text>
<line x1="124" y1="34" x2="143" y2="34" stroke="#506775" stroke-width="1.35" marker-end="url(#arr-blue)"/>
<rect x="146" y="22" width="114" height="24" rx="3.0" fill="#FFFFFF" stroke="#506775" stroke-width="1.15"/>
<text x="203.0" y="37.2" text-anchor="middle" class="t" font-size="9.3" font-weight="700" style="fill:#506775">L1 · NATIONAL</text>
<line x1="262" y1="34" x2="281" y2="34" stroke="#506775" stroke-width="1.35" marker-end="url(#arr-blue)"/>
<rect x="284" y="22" width="116" height="24" rx="3.0" fill="#FFFFFF" stroke="#506775" stroke-width="1.15"/>
<text x="342.0" y="37.2" text-anchor="middle" class="t" font-size="9.3" font-weight="700" style="fill:#506775">L2 · ISP ISLAND</text>
<line x1="402" y1="34" x2="421" y2="34" stroke="#6D6255" stroke-width="1.35" marker-end="url(#arr-amber)"/>
<rect x="424" y="22" width="116" height="24" rx="3.0" fill="#F6F3EF" stroke="#6D6255" stroke-width="1.6"/>
<text x="482.0" y="37.2" text-anchor="middle" class="t" font-size="9.3" font-weight="700" style="fill:#6D6255">L3 · BRIDGED</text>
<line x1="542" y1="34" x2="563" y2="34" stroke="#525D63" stroke-width="1.35" stroke-dasharray="3.5,2.5" marker-end="url(#arr-muted)"/>
<rect x="566" y="22" width="122" height="24" rx="3.0" fill="#F4F5F6" stroke="#525D63" stroke-width="1.15" stroke-dasharray="4,3"/>
<text x="627.0" y="37.2" text-anchor="middle" class="t" font-size="9.3" font-weight="700" style="fill:#30383D">L4 · ISOLATED</text>
<path d="M 12 49 V 53 H 540 V 49" fill="none" stroke="#525D63" stroke-width="0.95"/>
<rect x="172" y="48" width="208" height="14" fill="#FFFFFF"/><text x="276" y="57.5" text-anchor="middle" class="mut" font-size="8.8">evaluated IP federation scope: L0–L3</text>
<text x="627" y="57.5" text-anchor="middle" class="mut" font-size="8.8">out of scope</text>
<path d="M 266 100 V 78 H 620 V 100" fill="none" stroke="#755B61" stroke-width="1.25" stroke-dasharray="5,4"/>
<rect x="342" y="68" width="208" height="19" rx="3" fill="#F6F1F2" stroke="#755B61" stroke-width="1.25"/>
<text x="446" y="80.8" text-anchor="middle" class="hdr" font-size="9.2" style="fill:#755B61">&#x2715; Direct IX path withdrawn</text>

<!-- Each panel draws its outline last so the header fill cannot cover the stroke. -->
<g transform="translate(12 100)">
