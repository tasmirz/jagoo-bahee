<rect width="360" height="374" fill="#FFFFFF"/>
<rect x="52" y="6" width="256" height="34" rx="3.0" fill="#FFFFFF" stroke="#273238" stroke-width="1.25"/>
<text x="180.0" y="22.4" text-anchor="middle" class="t" font-size="9.3" font-weight="700" style="fill:#273238">SIGNED ENVELOPE</text>
<text x="180.0" y="33.5" text-anchor="middle" class="t" font-size="8.2" style="fill:#546E7A">exact received canonical protobuf bytes</text>
<line x1="180" y1="40" x2="180" y2="49" stroke="#273238" stroke-width="1.3" marker-end="url(#arr-ink)"/>
<rect x="20" y="51" width="320" height="35" rx="3.0" fill="#FDF4E7" stroke="#AB6A1D" stroke-width="1.25" stroke-dasharray="4,3"/>
<text x="180.0" y="67.7" text-anchor="middle" class="t" font-size="8.9" font-weight="700" style="fill:#AB6A1D">TRANSPORT PRE-GATE · OUTSIDE PIPELINE</text>
<text x="180.0" y="79.2" text-anchor="middle" class="t" font-size="8.1" style="fill:#273238">HTTP client limiter   |   gRPC PeerQuotaLimiter</text>
<path d="M 180 86 V 94 H 88 V 101" fill="none" stroke="#273238" stroke-width="1.3" marker-end="url(#arr-ink)"/>
<rect x="8" y="103" width="160" height="263" rx="3.5" fill="#FFFFFF" stroke="#235B85" stroke-width="1.35"/>
