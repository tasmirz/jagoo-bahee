<text x="88.0" y="117.0" text-anchor="middle" class="hdr" font-size="8.9">STAGES 1–12 · READ-ONLY</text>
<rect x="9.5" y="125" width="157" height="16" fill="#EAF2F8"/><text x="88" y="136.0" text-anchor="middle" class="t" font-size="8.0" font-weight="700" style="fill:#235B85">0 persistent database writes</text>
<rect x="16" y="147" width="144" height="36" rx="3.0" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.05"/>
<text x="88.0" y="164.0" text-anchor="middle" class="t" font-size="8.6" font-weight="700" style="fill:#273238">1–2 · BYTES</text>
<text x="88.0" y="175.8" text-anchor="middle" class="t" font-size="7.8" style="fill:#546E7A">size limit, parse, exact re-encode</text>
<line x1="88" y1="183" x2="88" y2="189" stroke="#273238" stroke-width="1.15" marker-end="url(#arr-ink)"/>
<rect x="16" y="190" width="144" height="36" rx="3.0" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.05"/>
<text x="88.0" y="207.0" text-anchor="middle" class="t" font-size="8.6" font-weight="700" style="fill:#273238">3–5 · ROUTING</text>
<text x="88.0" y="218.8" text-anchor="middle" class="t" font-size="7.8" style="fill:#546E7A">version, domain, plane</text>
<line x1="88" y1="226" x2="88" y2="232" stroke="#273238" stroke-width="1.15" marker-end="url(#arr-ink)"/>
<rect x="16" y="233" width="144" height="36" rx="3.0" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.05"/>
