<text x="88.0" y="261.8" text-anchor="middle" class="t" font-size="7.8" style="fill:#546E7A">domain size, alg, priority</text>
<line x1="88" y1="269" x2="88" y2="275" stroke="#273238" stroke-width="1.15" marker-end="url(#arr-ink)"/>
<rect x="16" y="276" width="144" height="36" rx="3.0" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.05"/>
<text x="88.0" y="293.0" text-anchor="middle" class="t" font-size="8.6" font-weight="700" style="fill:#273238">8–10 · AUTH</text>
<text x="88.0" y="304.8" text-anchor="middle" class="t" font-size="7.8" style="fill:#546E7A">clock window, Ed25519 sig, cert</text>
<line x1="88" y1="312" x2="88" y2="318" stroke="#273238" stroke-width="1.15" marker-end="url(#arr-ink)"/>
<rect x="16" y="319" width="144" height="36" rx="3.0" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1.05"/>
<text x="88.0" y="336.0" text-anchor="middle" class="t" font-size="8.6" font-weight="700" style="fill:#273238">11–12 · REPLAY</text>
<text x="88.0" y="347.8" text-anchor="middle" class="t" font-size="7.8" style="fill:#546E7A">CID dedupe (200), nonce (409)</text>
<rect x="192" y="103" width="160" height="263" rx="3.5" fill="#FFFFFF" stroke="#AB6A1D" stroke-width="1.35"/>
<path d="M 195.5 103 H 348.5 Q 352 103 352 106.5 V 125.0 H 192 V 106.5 Q 192 103 195.5 103 Z" fill="#AB6A1D"/>
<text x="272.0" y="117.0" text-anchor="middle" class="hdr" font-size="8.9">STAGES 13–19 · COMMIT</text>
