<rect x="200" y="147" width="144" height="36" rx="3.0" fill="#FDF4E7" stroke="#AB6A1D" stroke-width="1.4"/>
<text x="272.0" y="164.0" text-anchor="middle" class="t" font-size="8.6" font-weight="700" style="fill:#AB6A1D">13 · ANTI-ABUSE</text>
<text x="272.0" y="175.8" text-anchor="middle" class="t" font-size="7.8" style="fill:#546E7A">origin only (PoW / credits)</text>
<line x1="272" y1="183" x2="272" y2="189" stroke="#273238" stroke-width="1.2" marker-end="url(#arr-ink)"/>
<rect x="200" y="190" width="144" height="36" rx="3.0" fill="#FFFFFF" stroke="#273238" stroke-width="1.05"/>
<text x="272.0" y="207.0" text-anchor="middle" class="t" font-size="8.6" font-weight="700" style="fill:#273238">14–15 · SEMANTICS</text>
<text x="272.0" y="218.8" text-anchor="middle" class="t" font-size="7.8" style="fill:#546E7A">authorise (14), validate (15)</text>
<line x1="272" y1="226" x2="272" y2="232" stroke="#273238" stroke-width="1.2" marker-end="url(#arr-ink)"/>
<rect x="200" y="233" width="144" height="36" rx="3.0" fill="#FFFFFF" stroke="#273238" stroke-width="1.05"/>
<text x="272.0" y="250.0" text-anchor="middle" class="t" font-size="8.6" font-weight="700" style="fill:#273238">16–18 · ATOMIC TX</text>
<text x="272.0" y="261.8" text-anchor="middle" class="t" font-size="7.8" style="fill:#546E7A">store, project, Merkle, sign</text>
<line x1="272" y1="269" x2="272" y2="275" stroke="#273238" stroke-width="1.2" marker-end="url(#arr-ink)"/>
<rect x="200" y="276" width="144" height="36" rx="3.0" fill="#FFFFFF" stroke="#273238" stroke-width="1.05"/>
<text x="272.0" y="293.0" text-anchor="middle" class="t" font-size="8.6" font-weight="700" style="fill:#273238">19 · FAN-OUT</text>
<text x="272.0" y="304.8" text-anchor="middle" class="t" font-size="7.8" style="fill:#546E7A">durable outbox (excl. sender)</text>
<line x1="272" y1="312" x2="272" y2="318" stroke="#AB6A1D" stroke-width="1.2" marker-end="url(#arr-amber)"/>
<rect x="200" y="319" width="144" height="36" rx="3.0" fill="#E8F5F3" stroke="#237469" stroke-width="1.4"/>
<text x="272.0" y="336.0" text-anchor="middle" class="t" font-size="8.6" font-weight="700" style="fill:#237469">SIGNED RECEIPT</text>
<text x="272.0" y="347.8" text-anchor="middle" class="t" font-size="7.8" style="fill:#546E7A">CID + leaf + STH + proof</text>
<path d="M 160 337 H 180 V 165 H 198" fill="none" stroke="#273238" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr-ink)"/>
