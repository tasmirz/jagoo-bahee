<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Route-cut topology with an application-level validating bridge</title>
  <desc id="description">Island A contains application nodes A1 and A2, island B contains B1, and only A1 and B1 join the withdrawn IX segment. A dual-homed validating application bridge joins the surviving ISP-local paths with source addresses 10.90.1.30 and 10.90.2.30.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#00796B" />
    </marker>
    <marker id="arrow-blue" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#3568A8" />
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#B57600" />
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #202124; }
      .island-heading { font-size: 26px; font-weight: 700; }
      .subnet { font-size: 22px; fill: #37474F; }
      .node-name { font-size: 28px; font-weight: 700; }
      .node-meta { font-size: 18px; fill: #4D5156; }
      .edge-label { font-size: 18px; font-weight: 700; }
      .stage { font-size: 17px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="600" fill="#FFFFFF" />

  <!-- The withdrawn direct route. Only A1 and B1 attach to this IX. -->
  <path d="M200 265 H315 V90 H486" fill="none" stroke="#B3261E" stroke-width="2" stroke-dasharray="10 7" />
  <path d="M714 90 H825 V318 H995" fill="none" stroke="#B3261E" stroke-width="2" stroke-dasharray="10 7" />
  <rect x="486" y="48" width="228" height="84" fill="#F8F9FA" stroke="#5F6368" stroke-width="2" stroke-dasharray="8 5" />
  <text x="600" y="80" text-anchor="middle" font-size="27" font-weight="700">IX exchange</text>
  <text x="600" y="111" text-anchor="middle" font-size="21" fill="#37474F">10.90.9.0/24</text>
  <rect x="478" y="136" width="244" height="32" fill="#FFFFFF" />
  <text x="600" y="159" text-anchor="middle" font-size="22" font-weight="700" fill="#B3261E">× WITHDRAWN MID-RUN</text>
  <rect x="238" y="67" width="200" height="28" fill="#FFFFFF" />
  <text x="338" y="87" text-anchor="middle" font-size="19" fill="#8B1E18">direct inter-island path</text>

  <!-- Network islands. -->
  <rect x="30" y="150" width="315" height="300" fill="#F2FAF8" stroke="#00796B" stroke-width="2" />
  <text class="island-heading" x="50" y="192" fill="#00695C">Island A · ISP-A</text>
  <text class="subnet" x="50" y="222">AS 64501 · 10.90.1.0/24</text>
  <rect x="70" y="250" width="130" height="76" fill="#FFFFFF" stroke="#00796B" stroke-width="2" />
  <text class="node-name" x="135" y="281" text-anchor="middle">A₁</text>
  <text class="node-meta" x="135" y="309" text-anchor="middle">ISP-A + IX</text>
  <rect x="70" y="355" width="130" height="76" fill="#FFFFFF" stroke="#00796B" stroke-width="2" />
  <text class="node-name" x="135" y="386" text-anchor="middle">A₂</text>
  <text class="node-meta" x="135" y="414" text-anchor="middle">ISP-A only</text>
  <text x="218" y="402" font-size="18" font-style="italic" fill="#5F6368">not on IX</text>

  <rect x="855" y="150" width="315" height="300" fill="#F3F7FC" stroke="#3568A8" stroke-width="2" />
  <text class="island-heading" x="875" y="192" fill="#2F5F9A">Island B · ISP-B</text>
  <text class="subnet" x="875" y="222">AS 64502 · 10.90.2.0/24</text>
  <rect x="995" y="280" width="130" height="76" fill="#FFFFFF" stroke="#3568A8" stroke-width="2" />
  <text class="node-name" x="1060" y="311" text-anchor="middle">B₁</text>
  <text class="node-meta" x="1060" y="339" text-anchor="middle">ISP-B + IX</text>

  <!-- Bridge container and its source-bound uplinks. -->
  <rect x="430" y="220" width="340" height="245" fill="#FFF8E8" stroke="#B57600" stroke-width="2" />
  <text x="600" y="258" text-anchor="middle" font-size="28" font-weight="700" fill="#6E4800">Dual-homed bridge</text>
  <text x="600" y="282" text-anchor="middle" font-size="19" font-style="italic" fill="#4D5156">application relay — not an IP forwarder</text>
  <rect x="438" y="291" width="146" height="58" fill="#FFFFFF" stroke="#00796B" stroke-width="2" />
  <text x="511" y="314" text-anchor="middle" font-size="20" font-weight="700">uplink A</text>
  <text x="511" y="338" text-anchor="middle" font-size="17">source 10.90.1.30</text>
  <rect x="616" y="291" width="146" height="58" fill="#FFFFFF" stroke="#3568A8" stroke-width="2" />
  <text x="689" y="314" text-anchor="middle" font-size="20" font-weight="700">uplink B</text>
  <text x="689" y="338" text-anchor="middle" font-size="17">source 10.90.2.30</text>

  <!-- The measured surviving application-level route. -->
  <path d="M200 292 H438" fill="none" stroke="#00796B" stroke-width="4" marker-end="url(#arrow-teal)" />
  <path d="M200 393 L438 333" fill="none" stroke="#00796B" stroke-width="2" marker-end="url(#arrow-teal)" />
  <path d="M762 320 H995" fill="none" stroke="#3568A8" stroke-width="4" marker-end="url(#arrow-blue)" />
  <rect x="270" y="267" width="146" height="51" fill="#FFFFFF" />
  <text class="edge-label" x="343" y="286" text-anchor="middle" fill="#00695C">measured relay hop</text>
  <text x="343" y="309" text-anchor="middle" font-size="18" fill="#00695C">ISP_LOCAL gRPC</text>
  <rect x="781" y="267" width="158" height="51" fill="#FFFFFF" />
  <text class="edge-label" x="860" y="286" text-anchor="middle" fill="#2F5F9A">measured relay hop</text>
  <text x="860" y="309" text-anchor="middle" font-size="18" fill="#2F5F9A">ISP_LOCAL gRPC</text>

  <!-- Each bridge hop terminates in a full application admission and durable relay. -->
  <rect x="446" y="379" width="66" height="42" fill="#FFFFFF" stroke="#B57600" />
  <text class="stage" x="479" y="406" text-anchor="middle">validate</text>
  <rect x="526" y="379" width="58" height="42" fill="#FFFFFF" stroke="#B57600" />
  <text class="stage" x="555" y="406" text-anchor="middle">store</text>
  <rect x="598" y="379" width="58" height="42" fill="#FFFFFF" stroke="#B57600" />
  <text class="stage" x="627" y="406" text-anchor="middle">quota</text>
  <rect x="670" y="379" width="72" height="42" fill="#FFFFFF" stroke="#B57600" />
  <text class="stage" x="706" y="406" text-anchor="middle">outbox</text>
  <path d="M511 349 V365 H479 V379" fill="none" stroke="#B57600" stroke-width="1.5" marker-end="url(#arrow-amber)" />
  <path d="M512 400 H526" fill="none" stroke="#B57600" stroke-width="1.5" marker-end="url(#arrow-amber)" />
  <path d="M584 400 H598" fill="none" stroke="#B57600" stroke-width="1.5" marker-end="url(#arrow-amber)" />
  <path d="M656 400 H670" fill="none" stroke="#B57600" stroke-width="1.5" marker-end="url(#arrow-amber)" />
  <path d="M706 379 V365 H689 V349" fill="none" stroke="#B57600" stroke-width="1.5" marker-end="url(#arrow-amber)" />
  <text x="600" y="451" text-anchor="middle" font-size="18" fill="#6E4800">full admission · per-pair/class quota</text>

  <!-- Compact evidence footer from the preserved route-cut run. -->
  <rect x="30" y="492" width="1140" height="82" fill="#FAFAFA" stroke="#C6C8CC" />
  <text x="50" y="524" font-size="21" font-weight="700">Observed after the cut</text>
  <text x="284" y="524" font-size="23">author certificate 0.5 s  →  community record 1.2 s  →  post 2.1 s</text>
  <text x="600" y="558" text-anchor="middle" font-size="20" fill="#4D5156">Each exact signed envelope is revalidated and stored; trust controls rate and priority, never validity.</text>
</svg>
