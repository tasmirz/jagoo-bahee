<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">System architecture for partition-tolerant forum federation</title>
  <desc id="desc">A five-level reachability ladder, a client that signs canonical envelopes, independent forum nodes on two islands, an active dual-homed bridge path at L3, a signed receipt returned to the client, and client-built public audit certificates sent to independent audit-log services.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#163A5F"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0C7C86"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C98512"/>
    </marker>
    <marker id="arrow-red-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#B42318" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #182230; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 0.4px; fill: #163A5F; }
      .title { font-size: 14px; font-weight: 700; }
      .small-title { font-size: 11px; font-weight: 700; }
      .body { font-size: 11px; }
      .tiny { font-size: 10px; }
      .navy { fill: #163A5F; }
      .teal { fill: #075E65; }
      .amber { fill: #714B08; }
      .red { fill: #B42318; }
      .white { fill: #FFFFFF; }
      .center { text-anchor: middle; }
      .box { fill: #FFFFFF; stroke-width: 1.5; shape-rendering: geometricPrecision; }
      .thin { stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="40" y="32" class="section">REACHABILITY LADDER</text>
  <g>
    <rect x="40" y="45" width="270" height="60" class="box" stroke="#163A5F"/>
    <text x="175" y="70" class="title center">L0 · GLOBAL</text>
    <text x="175" y="91" class="body center">ordinary Internet or Tor reach</text>
    <rect x="350" y="45" width="270" height="60" class="box" stroke="#163A5F"/>
    <text x="485" y="70" class="title center">L1 · NATIONAL PARTITION</text>
    <text x="485" y="88" class="body center">international transit gone;</text>
    <text x="485" y="101" class="body center">domestic exchange survives</text>
    <rect x="660" y="45" width="270" height="60" class="box" stroke="#163A5F"/>
    <text x="795" y="70" class="title center">L2 · ISP ISLAND</text>
    <text x="795" y="91" class="body center">inter-ISP peering has failed</text>
    <rect x="970" y="45" width="270" height="60" fill="#FFF4D6" stroke="#C98512" stroke-width="2"/>
    <text x="1105" y="70" class="title center amber">L3 · BRIDGED ISLANDS</text>
    <text x="1105" y="88" class="body center amber">dual-homed validating node</text>
    <text x="1105" y="101" class="body center amber">restores a path</text>
    <rect x="1280" y="45" width="270" height="60" fill="#FFF1F0" stroke="#B42318" stroke-width="1.5"/>
    <text x="1415" y="70" class="title center red">L4 · TOTAL ISOLATION</text>
    <text x="1415" y="88" class="body center red">no IP path;</text>
    <text x="1415" y="101" class="body center red">isolated local service only</text>
    <path d="M310 75 H350" fill="none" stroke="#163A5F" stroke-width="1.5" marker-end="url(#arrow-navy)"/>
    <path d="M620 75 H660" fill="none" stroke="#163A5F" stroke-width="1.5" marker-end="url(#arrow-navy)"/>
    <path d="M930 75 H970" fill="none" stroke="#C98512" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
    <path d="M1240 75 H1280" fill="none" stroke="#B42318" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-red-open)"/>
    <rect x="40" y="114" width="1200" height="24" fill="#EAF7F6" stroke="#0C7C86"/>
    <text x="640" y="130" class="small-title center teal">EVALUATED IP-FEDERATION SCOPE · L0–L3 · HTTP(S) CLIENT ACCESS + gRPC FEDERATION</text>
    <rect x="1280" y="114" width="270" height="24" fill="#FFF1F0" stroke="#B42318"/>
    <text x="1415" y="130" class="small-title center red">OUTSIDE EVALUATED IP SCOPE</text>
  </g>

  <text x="40" y="165" class="section">SYSTEM DATA AND TRUST FLOWS · ILLUSTRATED L3 STATE</text>
  <text x="870" y="170" class="small-title center red">DIRECT S1 ↔ S2 PATH UNAVAILABLE AT L3</text>
  <path d="M500 215 V185 H1240 V215" fill="none" stroke="#B42318" stroke-width="1.8" stroke-dasharray="7 5" marker-start="url(#arrow-red-open)" marker-end="url(#arrow-red-open)"/>
  <circle cx="870" cy="185" r="16" fill="#FFFFFF" stroke="#B42318" stroke-width="2"/>
  <path d="M860 175 L880 195 M880 175 L860 195" stroke="#B42318" stroke-width="3"/>

  <g id="client">
    <rect x="40" y="215" width="260" height="400" class="box" stroke="#163A5F"/>
    <rect x="40" y="215" width="260" height="48" fill="#163A5F" stroke="#163A5F" stroke-width="1.5"/>
    <text x="170" y="236" class="title center white" style="fill:#FFFFFF">CLIENT C1</text>
    <text x="170" y="253" class="body center white" style="fill:#FFFFFF">on-device trust boundary</text>
    <rect x="60" y="283" width="220" height="92" fill="#EAF7F6" stroke="#0C7C86" stroke-width="1.3"/>
    <text x="170" y="303" class="small-title center teal">SIGN ON DEVICE</text>
    <text x="170" y="322" class="body center">canonical Protobuf bytes</text>
    <text x="170" y="339" class="body center">content_id = SHA-256(bytes)</text>
    <text x="170" y="356" class="body center">Ed25519 author signature</text>
    <rect x="60" y="388" width="220" height="52" fill="#F3F5F7" stroke="#163A5F"/>
    <text x="170" y="408" class="small-title center">IMMUTABLE ACROSS EVERY HOP</text>
    <text x="170" y="427" class="tiny center">canonical bytes · content ID · author signature</text>
    <rect x="60" y="458" width="220" height="56" fill="#FFF4D6" stroke="#C98512" stroke-width="1.2"/>
    <text x="170" y="480" class="small-title center amber">RECEIVE SIGNED RECEIPT</text>
    <text x="170" y="500" class="tiny center amber">only after successful server commit</text>
    <rect x="60" y="532" width="220" height="64" fill="#EAF7F6" stroke="#0C7C86" stroke-width="1.2"/>
    <text x="170" y="551" class="small-title center teal">BUILD + STORE LOCALLY</text>
    <text x="170" y="570" class="tiny center teal">public audit certificate</text>
    <text x="170" y="585" class="tiny center teal">then forward to one or more ALSs</text>
  </g>

  <g id="s1">
    <rect x="350" y="215" width="300" height="400" class="box" stroke="#0C7C86"/>
    <rect x="350" y="215" width="300" height="48" fill="#0C7C86" stroke="#0C7C86" stroke-width="1.5"/>
    <text x="500" y="236" class="title center white" style="fill:#FFFFFF">ISLAND A · FORUM NODE S1</text>
    <text x="500" y="253" class="body center white" style="fill:#FFFFFF">independent operator</text>
    <rect x="370" y="283" width="260" height="52" fill="#F3F5F7" stroke="#667085"/>
    <text x="500" y="303" class="small-title center">INGRESS + ADMISSION CONTEXT</text>
    <text x="500" y="322" class="tiny center">kind · peer · direction · uplink · class · quota</text>
    <rect x="370" y="350" width="260" height="70" fill="#EEF4FA" stroke="#163A5F" stroke-width="1.2"/>
    <text x="500" y="369" class="small-title center navy">19-STAGE ADMISSION</text>
    <text x="500" y="386" class="tiny center">stages 1–12: validation; no persistent writes</text>
    <text x="500" y="401" class="tiny center">canonicality · ID · signature</text>
    <text x="500" y="414" class="tiny center">certificate · dedupe · replay</text>
    <rect x="370" y="435" width="260" height="64" fill="#EAF7F6" stroke="#0C7C86" stroke-width="1.2"/>
    <text x="500" y="455" class="small-title center teal">ATOMIC PERSISTENCE</text>
    <text x="500" y="474" class="tiny center">raw envelope · indexes / projections</text>
    <text x="500" y="490" class="tiny center">Merkle leaf + log</text>
    <rect x="370" y="514" width="260" height="70" fill="#FFF4D6" stroke="#C98512" stroke-width="1.2"/>
    <text x="500" y="535" class="small-title center amber">AFTER COMMIT</text>
    <text x="500" y="554" class="tiny center amber">signed operator receipt</text>
    <text x="500" y="570" class="tiny center amber">durable outbox + per-peer scheduler</text>
    <path d="M500 335 V350 M500 420 V435 M500 499 V514" fill="none" stroke="#163A5F" stroke-width="1.2" marker-end="url(#arrow-navy)"/>
    <rect x="374" y="423" width="252" height="13" fill="#FFFFFF"/>
    <text x="500" y="433" class="center" font-size="8.5">stage 13 anti-abuse (local) · peer quota at transport</text>
  </g>

  <g id="s3">
    <rect x="710" y="215" width="320" height="400" fill="#FFFFFF" stroke="#C98512" stroke-width="2"/>
    <rect x="710" y="215" width="320" height="58" fill="#FFF4D6" stroke="#C98512" stroke-width="2"/>
    <text x="870" y="236" class="title center amber">FORUM NODE S3 · DUAL-HOMED BRIDGE</text>
    <text x="870" y="254" class="tiny center amber">ordinary validating application node · not an IP router</text>
    <rect x="730" y="290" width="280" height="52" fill="#F3F5F7" stroke="#667085"/>
    <text x="870" y="310" class="small-title center">INGRESS + ADMISSION CONTEXT</text>
    <text x="870" y="329" class="tiny center">peer · source uplink A/B · class · per-uplink quota</text>
    <rect x="730" y="357" width="280" height="64" fill="#EEF4FA" stroke="#163A5F" stroke-width="1.2"/>
    <text x="870" y="378" class="small-title center navy">SAME 19-STAGE ADMISSION</text>
    <text x="870" y="397" class="tiny center">independent validation under S3 policy / key</text>
    <text x="870" y="413" class="tiny center">trust never relaxes validity</text>
    <rect x="730" y="436" width="280" height="64" fill="#EAF7F6" stroke="#0C7C86" stroke-width="1.2"/>
    <text x="870" y="456" class="small-title center teal">ATOMIC PERSISTENCE</text>
    <text x="870" y="475" class="tiny center">raw envelope · indexes / projections</text>
    <text x="870" y="491" class="tiny center">Merkle leaf + log</text>
    <rect x="730" y="515" width="280" height="70" fill="#FFF4D6" stroke="#C98512" stroke-width="1.2"/>
    <text x="870" y="536" class="small-title center amber">AFTER COMMIT</text>
    <text x="870" y="555" class="tiny center amber">receipt · durable outbox / scheduler</text>
    <text x="870" y="571" class="tiny center amber">exclude supplying peer from fan-out</text>
    <path d="M870 342 V357 M870 421 V436 M870 500 V515" fill="none" stroke="#163A5F" stroke-width="1.2" marker-end="url(#arrow-navy)"/>
    <rect x="782" y="424" width="176" height="13" fill="#FFFFFF"/>
    <text x="870" y="434" class="tiny center">quota by uplink pair + traffic class</text>
  </g>

  <g id="s2">
    <rect x="1090" y="215" width="300" height="400" class="box" stroke="#163A5F"/>
    <rect x="1090" y="215" width="300" height="48" fill="#163A5F" stroke="#163A5F" stroke-width="1.5"/>
    <text x="1240" y="236" class="title center white" style="fill:#FFFFFF">ISLAND B · FORUM NODE S2</text>
    <text x="1240" y="253" class="body center white" style="fill:#FFFFFF">independent operator</text>
    <rect x="1110" y="283" width="260" height="52" fill="#F3F5F7" stroke="#667085"/>
    <text x="1240" y="303" class="small-title center">INGRESS + ADMISSION CONTEXT</text>
    <text x="1240" y="322" class="tiny center">kind · peer · direction · uplink · class · quota</text>
    <rect x="1110" y="350" width="260" height="70" fill="#EEF4FA" stroke="#163A5F" stroke-width="1.2"/>
    <text x="1240" y="369" class="small-title center navy">19-STAGE ADMISSION</text>
    <text x="1240" y="386" class="tiny center">stages 1–12: validation; no persistent writes</text>
    <text x="1240" y="401" class="tiny center">canonicality · ID · signature</text>
    <text x="1240" y="414" class="tiny center">certificate · dedupe · replay</text>
    <rect x="1110" y="435" width="260" height="64" fill="#EAF7F6" stroke="#0C7C86" stroke-width="1.2"/>
    <text x="1240" y="455" class="small-title center teal">ATOMIC PERSISTENCE</text>
    <text x="1240" y="474" class="tiny center">raw envelope · indexes / projections</text>
    <text x="1240" y="490" class="tiny center">Merkle leaf + log</text>
    <rect x="1110" y="514" width="260" height="70" fill="#FFF4D6" stroke="#C98512" stroke-width="1.2"/>
    <text x="1240" y="535" class="small-title center amber">AFTER COMMIT</text>
    <text x="1240" y="554" class="tiny center amber">signed operator receipt</text>
    <text x="1240" y="570" class="tiny center amber">durable outbox + per-peer scheduler</text>
    <path d="M1240 335 V350 M1240 420 V435 M1240 499 V514" fill="none" stroke="#163A5F" stroke-width="1.2" marker-end="url(#arrow-navy)"/>
    <rect x="1114" y="423" width="252" height="13" fill="#FFFFFF"/>
    <text x="1240" y="433" class="center" font-size="8.5">stage 13 anti-abuse (local) · peer quota at transport</text>
  </g>

  <path d="M280 309 H370" fill="none" stroke="#163A5F" stroke-width="1.8" marker-end="url(#arrow-navy)"/>
  <rect x="276" y="276" width="168" height="18" fill="#FFFFFF"/>
  <text x="360" y="289" class="small-title center navy">HTTPS · exact signed envelope</text>
  <path d="M370 549 H325 V486 H280" fill="none" stroke="#C98512" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <rect x="260" y="523" width="150" height="18" fill="#FFFFFF"/>
  <text x="335" y="536" class="small-title center amber">signed receipt · after commit</text>

  <path d="M630 309 H730" fill="none" stroke="#0C7C86" stroke-width="2.2" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <rect x="649" y="282" width="62" height="17" fill="#FFFFFF" stroke="#0C7C86"/>
  <text x="680" y="294" class="tiny center teal" font-weight="700">UPLINK A</text>
  <text x="680" y="326" class="tiny center teal" font-weight="700">gRPC · active L3</text>
  <path d="M1010 309 H1110" fill="none" stroke="#0C7C86" stroke-width="2.2" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <rect x="1029" y="282" width="62" height="17" fill="#FFFFFF" stroke="#163A5F"/>
  <text x="1060" y="294" class="tiny center navy" font-weight="700">UPLINK B</text>
  <text x="1060" y="326" class="tiny center teal" font-weight="700">gRPC · active L3</text>

  <rect x="350" y="625" width="1040" height="32" fill="#EEF4FA" stroke="#163A5F"/>
  <text x="870" y="646" class="body center navy"><tspan font-weight="700">CALLER-INITIATED FEDERATION</tspan><tspan> · Deliver | StreamActivities | Backfill · exact received envelope bytes; transport never decodes or re-encodes</tspan></text>
  <rect x="560" y="666" width="660" height="28" fill="#FFF4D6" stroke="#C98512" stroke-dasharray="5 4"/>
  <text x="890" y="684" class="tiny center amber" font-weight="700">BRIDGE TRUST IS PRECONFIGURED · controls rate, priority, traffic class, and quota only · NEVER object validity</text>

  <rect x="1230" y="666" width="330" height="28" fill="#EAF7F6" stroke="#0C7C86"/>
  <text x="1395" y="679" class="small-title center teal">POST-ACCEPTANCE AUDIT</text>
  <text x="1395" y="690" class="tiny center teal">outside the forum-node write path</text>
  <path d="M170 596 V724 H575 V742" fill="none" stroke="#0C7C86" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-teal)"/>
  <path d="M170 596 V714 H1145 V742" fill="none" stroke="#0C7C86" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-teal)"/>
  <rect x="252" y="704" width="156" height="18" fill="#FFFFFF"/>
  <text x="330" y="717" class="small-title center teal">public audit certificate</text>
  <rect x="712" y="694" width="156" height="18" fill="#FFFFFF"/>
  <text x="790" y="707" class="small-title center teal">public audit certificate</text>

  <g id="als-a">
    <rect x="360" y="742" width="430" height="112" class="box" stroke="#0C7C86"/>
    <text x="575" y="766" class="title center teal">INDEPENDENT AUDIT-LOG SERVICE · ALS A</text>
    <text x="575" y="787" class="tiny center">re-verify envelope · content_id · receipt</text>
    <text x="575" y="805" class="tiny center">signed tree head · inclusion proof</text>
    <text x="575" y="830" class="small-title center teal">append to own hash-chained record</text>
  </g>
  <g id="als-b">
    <rect x="930" y="742" width="430" height="112" class="box" stroke="#0C7C86"/>
    <text x="1145" y="766" class="title center teal">INDEPENDENT AUDIT-LOG SERVICE · ALS B</text>
    <text x="1145" y="787" class="tiny center">re-verify envelope · content_id · receipt</text>
    <text x="1145" y="805" class="tiny center">signed tree head · inclusion proof</text>
    <text x="1145" y="830" class="small-title center teal">append to own hash-chained record</text>
  </g>
</svg>
