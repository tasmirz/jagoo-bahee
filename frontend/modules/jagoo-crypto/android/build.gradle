apply plugin: 'com.android.library'

group = 'com.jagoobahee.crypto'
version = '1.0.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace "com.jagoobahee.crypto"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Pinning is part of the wire-parity boundary. BC 1.83 matches Noble 0.3's deterministic
  // ML-KEM/ML-DSA vectors; upgrades require the on-device parity suite.
  implementation "org.bouncycastle:bcprov-jdk18on:1.83"
  testImplementation "junit:junit:4.13.2"
}
